String getConfig(String key) {
    return project.properties.get(key)
}

def mod_id = getConfig("mod_id")
def version = getConfig("version")
def mod_license = getConfig("mod_license")
def mod_name = getConfig("mod_name")
def mod_description = getConfig("mod_description")
def mod_url = getConfig("mod_url")
def mod_issue_tracker = getConfig("mod_issue_tracker")

String suffix = System.getenv("VERSION_SUFFIX")
String version_toml = "$version" + (suffix ? "+$suffix" : "")

tasks.register('printVersion') {
    doLast {
        println mod_version
    }
}

// Create run-folders for non-client configs to avoid pollution of dev envs
tasks.matching { it.name.startsWith('prepare') }.configureEach {
    doFirst {
        mkdir('run')
        mkdir('run/server')
        mkdir('run/gametest')
        mkdir('run/data')
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var neoVersion = libs.versions.neoForge.get()
    neoVersion = neoVersion.substring(0, neoVersion.lastIndexOf('.'))
    var configurationVersion = forge.versions.configuration.get()
    configurationVersion = configurationVersion.substring(0, configurationVersion.lastIndexOf('-'))
    var replaceProperties = [
            version             : version_toml,
            mod_id              : mod_id,
            minecraft_version   : "[1.21, 1.21.1]",
            loader_version      : libs.versions.loader.get(),
            neo_version         : neoVersion,
            configuration_version : configurationVersion,
            kjs_version         : forge.versions.kubejs.get().split("\\.")[0], // only specify major version of kjs
            jei_version         : forge.versions.jei.get(),
            emi_version         : forge.versions.emi.get(),
            jade_version        : forge.versions.jade.get(),
            modernfix_version   : forge.versions.modernfix.get(),
            sable_version       : forge.versions.sable.get(),
            sodium_version      : forge.versions.sodium.get(),
            embeddium_version   : forge.versions.embeddium.get(),
            mod_license         : mod_license,
            mod_name            : mod_name,
            mod_description     : mod_description,
            mod_url             : mod_url,
            mod_issue_tracker   : mod_issue_tracker
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Optional integrations are registered when their mods are installed, so a normal
// standalone run cannot detect a stale declaration. Check the actual release JAR.
tasks.register('verifyMixinConfigs') {
    group = 'verification'
    description = 'Verifies that every declared Mixin configuration exists in the production JAR.'
    dependsOn tasks.named('jar')
    inputs.file(tasks.named('jar', Jar).flatMap { it.archiveFile })
    doLast {
        def artifact = tasks.named('jar', Jar).get().archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { archive ->
            def metadata = archive.getEntry('META-INF/neoforge.mods.toml')
            if (metadata == null) {
                throw new GradleException("Missing NeoForge metadata in ${artifact.name}")
            }
            def contents = archive.getInputStream(metadata).withCloseable { it.getText('UTF-8') }
            def configs = (contents =~ /(?m)^\s*config\s*=\s*"([^"]+)"/).collect { it[1] }
            if (configs.isEmpty()) {
                throw new GradleException("No Mixin configurations declared in ${artifact.name}")
            }
            def missing = configs.findAll { archive.getEntry(it) == null }
            if (!missing.isEmpty()) {
                throw new GradleException("Missing declared Mixin configurations in ${artifact.name}: ${missing.join(', ')}")
            }
        }
    }
}

tasks.named('check') { dependsOn 'verifyMixinConfigs' }
